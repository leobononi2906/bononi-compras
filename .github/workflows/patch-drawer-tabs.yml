name: Patch drawer tab globals

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch compras drawer functions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('compras.js')
          txt = p.read_text(encoding='utf-8')
          marker = '// DRAWER_GLOBAL_EXPORTS_PATCH'
          if marker in txt:
              print('Patch already applied')
              raise SystemExit(0)
          exports = r'''

// DRAWER_GLOBAL_EXPORTS_PATCH
// Inline onclick handlers need these functions on window scope.
Object.assign(window, {
  abrirProduto,
  fecharDrawer,
  switchDrawerTab,
  setHistFiltro,
  toggleCarrinho,
  adicionarAoCarrinho,
  removerDoCarrinho,
  exportarPedido,
  abrirFornDrawer,
  fecharFornDrawer,
  switchFornTab,
  setImpView,
  abrirImpDrawer,
  fecharImpDrawer,
  switchImpTab,
  abrirModalNovoProcesso,
  fecharModalProcesso,
  novasSessao
});
'''
          needle = '\n})();'
          idx = txt.rfind(needle)
          if idx == -1:
              raise SystemExit('Could not find closing IIFE')
          txt = txt[:idx] + exports + txt[idx:]
          p.write_text(txt, encoding='utf-8')
          PY
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compras.js
          git commit -m "Fix drawer tab navigation globals"
          git push
